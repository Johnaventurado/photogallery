<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photo Details | John's Gallery</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>


<body>


    <!-- NAVIGATION -->

    <nav class="navbar">

        <a href="index.html" class="logo">

            <div class="camera-logo">
                ●
            </div>

            <div>

                <span>
                    John Aventurado Gallery
                </span>

                <small>
                    CAPTURING MEMORIES
                </small>

            </div>

        </a>


        <div class="nav-links">

            <a href="index.html">
                HOME
            </a>

            <a href="gallery.html">
                GALLERY
            </a>

            <a href="about.html">
                ABOUT
            </a>

            <a href="contact.html">
                CONTACT
            </a>

        </div>


        <div class="social-icons">

            <a href="#">f</a>
            <a href="#">◎</a>
            <a href="#">✉</a>

        </div>

    </nav>



    <!-- PHOTO DETAIL -->

    <main class="photo-detail">


        <div class="detail-image">

            <img id="detailImage" src="" alt="">

        </div>



        <div class="detail-content">

            <p class="gold-text">
                MY MEMORY
            </p>


            <h1 id="detailTitle">
                Photo Title
            </h1>


            <div class="heading-line detail-line">

                <span></span>

                <b>▣</b>

                <span></span>

            </div>


            <p id="detailDescription" class="description">
                Photo description.
            </p>



            <div class="photo-information">


                <div>

                    <span>
                        📍 LOCATION
                    </span>

                    <strong id="detailLocation">
                        Location
                    </strong>

                </div>


                <div>

                    <span>
                        📅 DATE
                    </span>

                    <strong id="detailDate">
                        Date
                    </strong>

                </div>


                <div>

                    <span>
                        🏷 CATEGORY
                    </span>

                    <strong id="detailCategory">
                        Category
                    </strong>

                </div>


            </div>



            <a href="index.html" class="gold-button">

                ← BACK TO HOME

            </a>


        </div>


    </main>



    <footer>

        <p>
            © 2026 John's Personal Photo Gallery
        </p>

        <p>
            Capturing memories, one photo at a time.
        </p>

    </footer>



    <script src="script.js"></script>

</body>

</html>
